name: iMarble
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
targets:
  iMarble:
    type: application
    platform: iOS
    sources:
      - path: iMarble
    info:
      path: iMarble/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: iMarble
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.imarble
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: iMarble/App/iMarble.entitlements
      properties:
        com.apple.developer.game-center: true
  iMarbleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iMarbleTests
    dependencies:
      - target: iMarble
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  iMarbleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iMarbleUITests
    dependencies:
      - target: iMarble
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  iMarble:
    build:
      targets:
        iMarble: all
    test:
      targets:
        - iMarbleTests
        - iMarbleUITests
    run:
      config: Debug
